name: Jotform Snapshot Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jotform-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch encrypted snapshot
        run: curl -fsS https://jefscouting.com/api/jotform-admin-snapshot -o snapshot.json
      - name: Upload encrypted snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: jotform-encrypted-snapshot
          path: snapshot.json
          retention-days: 1
