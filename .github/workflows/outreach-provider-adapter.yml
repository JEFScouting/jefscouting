name: Outreach Provider Adapter CI

on:
  push:
    branches:
      - codex/outreach-v2-gmail-adapter-skeleton
    paths:
      - 'outreach-provider-adapter/**'
      - '.github/workflows/outreach-provider-adapter.yml'
  pull_request:
    paths:
      - 'outreach-provider-adapter/**'
      - '.github/workflows/outreach-provider-adapter.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outreach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: outreach-provider-adapter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependency
        run: npm install --no-audit --no-fund
      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/outreach_test
        run: npm test
