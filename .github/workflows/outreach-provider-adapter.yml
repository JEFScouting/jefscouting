name: Outreach Provider Adapter CI

on:
  push:
    branches:
      - codex/outreach-v2-gmail-adapter-skeleton
    paths:
      - 'outreach-provider-adapter/**'
      - '.github/workflows/outreach-provider-adapter.yml'
  pull_request:
    paths:
      - 'outreach-provider-adapter/**'
      - '.github/workflows/outreach-provider-adapter.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outreach-provider-adapter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test
        run: npm test
