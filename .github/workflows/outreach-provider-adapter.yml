name: Outreach Provider Adapter and Runtime CI

on:
  push:
    branches:
      - codex/outreach-v2-gmail-adapter-skeleton
    paths:
      - 'outreach-provider-adapter/**'
      - 'netlify/functions/**'
      - 'test/outreach-runtime-guard.test.mjs'
      - 'package.json'
      - 'netlify.toml'
      - '.github/workflows/outreach-provider-adapter.yml'
  pull_request:
    paths:
      - 'outreach-provider-adapter/**'
      - 'netlify/functions/**'
      - 'test/outreach-runtime-guard.test.mjs'
      - 'package.json'
      - 'netlify.toml'
      - '.github/workflows/outreach-provider-adapter.yml'

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outreach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: outreach-provider-adapter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install adapter dependencies
        run: npm install --no-audit --no-fund
      - name: Test adapter
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/outreach_test
        run: npm test

  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Compile Netlify runtime
        run: npm run build:outreach-runtime
      - name: Test runtime authority boundary
        run: npm run test:outreach-runtime

  live-runtime-identity:
    name: Live runtime identity (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed v1.1.3 identity without authentication or send authority
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://jef-outreach-next-runtime.netlify.app/slice01'
          expected_version='JEF-OUTREACH-RUNTIME-v1.1.3-gmail-send-gated'
          body_file="${RUNNER_TEMP}/outreach-live-identity.json"

          status="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 20 \
            --output "${body_file}" \
            --write-out '%{http_code}' \
            "${endpoint}")"

          echo "Live endpoint HTTP status: ${status}"
          cat "${body_file}"

          test "${status}" = '405'

          BODY_FILE="${body_file}" EXPECTED_VERSION="${expected_version}" node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.env.BODY_FILE, 'utf8'));
          if (body.error !== 'POST_ONLY') {
            throw new Error(`Expected error=POST_ONLY, received ${JSON.stringify(body.error)}`);
          }
          if (body.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`Expected version=${process.env.EXPECTED_VERSION}, received ${JSON.stringify(body.version)}`);
          }
          console.log(`Live runtime identity PASS: ${body.version}`);
          NODE
