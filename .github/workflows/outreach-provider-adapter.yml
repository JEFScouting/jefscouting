name: Outreach Provider Adapter and Runtime CI

on:
  push:
    branches:
      - codex/outreach-v2-gmail-adapter-skeleton
    paths:
      - 'outreach-provider-adapter/**'
      - 'netlify/functions/**'
      - 'netlify/outreach-functions/**'
      - 'test/outreach-runtime-guard.test.mjs'
      - 'package.json'
      - 'netlify.toml'
      - '.github/workflows/outreach-provider-adapter.yml'
  pull_request:
    paths:
      - 'outreach-provider-adapter/**'
      - 'netlify/functions/**'
      - 'netlify/outreach-functions/**'
      - 'test/outreach-runtime-guard.test.mjs'
      - 'package.json'
      - 'netlify.toml'
      - '.github/workflows/outreach-provider-adapter.yml'

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outreach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: outreach-provider-adapter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install adapter dependencies
        run: npm install --no-audit --no-fund
      - name: Test adapter
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/outreach_test
        run: npm test

  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Compile Netlify runtime
        run: npm run build:outreach-runtime
      - name: Test runtime authority boundary
        run: npm run test:outreach-runtime

  release-boundary:
    name: Isolated Outreach release boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source identity, mirrors, and isolated composition
        shell: bash
        run: |
          set -euo pipefail
          cmp netlify/functions/slice01.mts netlify/outreach-functions/slice01.mts
          node <<'NODE'
          const fs = require('fs');
          const expected = [
            'outreach-airtable-gate-diagnostic-once.mts',
            'outreach-airtable-gate-diagnostic.mts',
            'slice01.mts'
          ];
          const actual = fs.readdirSync('netlify/outreach-functions').sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected isolated function composition: ${JSON.stringify(actual)}`);
          }
          const source = fs.readFileSync('netlify/outreach-functions/slice01.mts','utf8');
          if (!source.includes('JEF-OUTREACH-RUNTIME-v1.1.9-manual-followup')) throw new Error('Runtime identity mismatch');
          if (/client-jotform-webhook/i.test(actual.join('\n'))) throw new Error('Jotform function present');
          const config = fs.readFileSync('netlify.toml','utf8');
          if (!config.includes('directory = "netlify/outreach-functions"')) throw new Error('Wrong functions directory');
          if (!config.includes('OUTREACH_RUNTIME_MODE = "manual"')) throw new Error('Manual mode not configured');
          if (!config.includes('OUTREACH_SEND_ENABLED = "false"')) throw new Error('Global send authority is not disabled');
          if (/OUTREACH_CANARY_EFFECT_KEY/.test(config)) throw new Error('Bespoke EffectKey binding remains');
          console.log('Isolated Outreach release boundary PASS');
          NODE
