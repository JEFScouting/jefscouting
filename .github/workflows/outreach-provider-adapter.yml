name: Outreach Provider Adapter and Runtime CI

on:
  push:
    branches:
      - codex/outreach-v2-gmail-adapter-skeleton
    paths:
      - 'outreach-provider-adapter/**'
      - 'netlify/functions/**'
      - 'test/outreach-runtime-guard.test.mjs'
      - 'package.json'
      - 'netlify.toml'
      - '.github/workflows/outreach-provider-adapter.yml'
  pull_request:
    paths:
      - 'outreach-provider-adapter/**'
      - 'netlify/functions/**'
      - 'test/outreach-runtime-guard.test.mjs'
      - 'package.json'
      - 'netlify.toml'
      - '.github/workflows/outreach-provider-adapter.yml'

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outreach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: outreach-provider-adapter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install adapter dependencies
        run: npm install --no-audit --no-fund
      - name: Test adapter
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/outreach_test
        run: npm test

  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Compile Netlify runtime
        run: npm run build:outreach-runtime
      - name: Test runtime authority boundary
        run: npm run test:outreach-runtime

  live-runtime-identity:
    name: Live runtime identity (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Verify current pre-deploy v1.1.6 identity without authentication or send authority
        shell: bash
        run: |
          set -euo pipefail
          base='https://jef-outreach-next-runtime.netlify.app'
          expected_version='JEF-OUTREACH-RUNTIME-v1.1.6-one-effectkey-canary-boundary'
          body_file="${RUNNER_TEMP}/outreach-live-identity.json"

          probe_get() {
            local path="$1"
            curl --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              --output "${body_file}" \
              --write-out '%{http_code}' \
              "${base}${path}"
          }

          probe_post() {
            local path="$1"
            curl --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              --request POST \
              --header 'content-type: application/json' \
              --data '{}' \
              --output "${body_file}" \
              --write-out '%{http_code}' \
              "${base}${path}"
          }

          canonical_status="$(probe_get '/slice01')"
          echo "GET /slice01 -> HTTP ${canonical_status}"
          if [ "${canonical_status}" = '405' ]; then
            live_path='/slice01'
            expected_error='POST_ONLY'
          else
            native_status="$(probe_post '/.netlify/functions/slice01')"
            echo "Unauthenticated POST /.netlify/functions/slice01 -> HTTP ${native_status}"
            if [ "${native_status}" != '401' ]; then
              echo 'Neither canonical route nor native fail-closed auth boundary reached the expected handler.' >&2
              cat "${body_file}" >&2
              exit 1
            fi
            live_path='/.netlify/functions/slice01'
            expected_error='UNAUTHORIZED'
            echo 'ROUTING_NOTE: /slice01 is not published; native Netlify function route is live.'
          fi

          BODY_FILE="${body_file}" EXPECTED_VERSION="${expected_version}" EXPECTED_ERROR="${expected_error}" LIVE_PATH="${live_path}" node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.env.BODY_FILE, 'utf8'));
          if (body.error !== process.env.EXPECTED_ERROR) {
            throw new Error(`Expected error=${process.env.EXPECTED_ERROR}, received ${JSON.stringify(body.error)}`);
          }
          if (body.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`Expected version=${process.env.EXPECTED_VERSION}, received ${JSON.stringify(body.version)}`);
          }
          console.log(`Live runtime identity PASS at ${process.env.LIVE_PATH}: ${body.version}`);
          NODE
