name: Jotform Encrypted Audit Snapshot

on:
  push:
    branches: [main]
    paths:
      - "netlify/functions/jotform-audit-snapshot.mts"
      - ".github/workflows/jotform-audit-snapshot.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for production snapshot route and capture ciphertext
        shell: bash
        run: |
          set -euo pipefail
          url="https://jefscouting.com/api/jotform-audit-snapshot"
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --output snapshot.json --write-out "%{http_code}" "$url" || true)
            if [ "$status" = "200" ] && jq -e 'has("version") and has("algorithm") and has("encryptedKey") and has("iv") and has("tag") and has("ciphertext")' snapshot.json >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Encrypted snapshot route did not become ready in time" >&2
          exit 1

      - name: Upload encrypted snapshot
        uses: actions/upload-artifact@v4
        with:
          name: jotform-encrypted-audit-snapshot
          path: snapshot.json
          retention-days: 1
          if-no-files-found: error
