name: Outreach threaded follow-up one-shot patch

on:
  push:
    branches:
      - codex/outreach-v2-gmail-adapter-skeleton
    paths:
      - '.github/workflows/outreach-thread-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/outreach-v2-gmail-adapter-skeleton
          fetch-depth: 0

      - name: Apply bounded patch
        run: python scripts/outreach-thread-fix-once.py

      - name: Test adapter
        working-directory: outreach-provider-adapter
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Compile and test runtime
        run: |
          npm install --no-audit --no-fund
          npm run build:outreach-runtime
          npm run test:outreach-runtime

      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/outreach-thread-fix-once.yml scripts/outreach-thread-fix-once.py
          git add outreach-provider-adapter/src/adapter.js netlify/functions/slice01.mts test/outreach-runtime-guard.test.mjs
          git commit -m 'Wire threaded follow-ups through runtime with fresh mailbox gate'
          git push origin HEAD:codex/outreach-v2-gmail-adapter-skeleton
